<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>武林角色测试 - TechEdict</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23c23a2a'/><text x='50' y='68' font-family='serif' font-size='52' fill='%23f5f0e8' text-anchor='middle' font-weight='bold'>武</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root {
  --bg-paper: #f5f0e8;
  --bg-dark: #2c1810;
  --text-primary: #3c2415;
  --text-secondary: #6b4c3b;
  --accent-red: #c23a2a;
  --accent-gold: #b8860b;
  --accent-black: #1a1a2e;
  --border-ink: #3c2415;
  --ink-light: rgba(60,36,21,0.15);
  --ink-medium: rgba(60,36,21,0.3);
  --ink-heavy: rgba(60,36,21,0.6);
  --font-title: 'Ma Shan Zheng', cursive;
  --font-body: 'Noto Serif SC', serif;
  --font-accent: 'ZCOOL XiaoWei', serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg-paper);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* 宣纸纹理背景 */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(194,58,42,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(184,134,11,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(60,36,21,0.02) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
}

/* 开场页 */
.start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes brushStroke {
  from { stroke-dashoffset: 300; }
  to { stroke-dashoffset: 0; }
}

@keyframes sealStamp {
  0% { transform: scale(3) rotate(-20deg); opacity: 0; }
  60% { transform: scale(1.05) rotate(-2deg); opacity: 0.9; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes typing {
  from { width: 0; }
  to { width: 100%; }
}

@keyframes blink {
  50% { border-color: transparent; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

.title-wrapper {
  position: relative;
  margin-bottom: 20px;
}

.main-title {
  font-family: var(--font-title);
  font-size: clamp(48px, 10vw, 88px);
  color: var(--accent-red);
  line-height: 1.2;
  text-shadow: 2px 2px 0 rgba(60,36,21,0.1);
  letter-spacing: 8px;
}

.sub-title {
  font-family: var(--font-accent);
  font-size: clamp(16px, 3vw, 22px);
  color: var(--text-secondary);
  margin-top: 12px;
  letter-spacing: 4px;
}

.divider-brush {
  width: 120px;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
  margin: 24px auto;
  border-radius: 2px;
}

.start-desc {
  font-family: var(--font-body);
  font-size: clamp(14px, 2.5vw, 16px);
  color: var(--text-secondary);
  max-width: 500px;
  line-height: 2;
  margin-bottom: 16px;
}

.clans-preview {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 24px 0 36px;
  max-width: 600px;
}

.clan-tag {
  font-family: var(--font-accent);
  font-size: 13px;
  color: var(--text-secondary);
  background: var(--ink-light);
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid var(--ink-light);
  transition: all 0.3s;
}

.clan-tag:hover {
  background: var(--ink-medium);
  color: var(--text-primary);
  transform: translateY(-2px);
}

.btn-start {
  font-family: var(--font-accent);
  font-size: 20px;
  color: var(--bg-paper);
  background: var(--accent-red);
  border: none;
  padding: 14px 56px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 6px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.btn-start:hover {
  background: #a52e20;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(194,58,42,0.3);
}

.btn-start:active {
  transform: translateY(0);
}

/* 答题页 */
.quiz-screen {
  animation: fadeIn 0.5s ease;
  padding-top: 20px;
}

.progress-scroll {
  position: relative;
  width: 100%;
  height: 8px;
  background: var(--ink-light);
  border-radius: 4px;
  margin-bottom: 40px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-red), var(--accent-gold));
  border-radius: 4px;
  transition: width 0.5s ease;
}

.progress-text {
  font-family: var(--font-accent);
  font-size: 13px;
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 8px;
}

.scene-box {
  background: rgba(60,36,21,0.04);
  border-left: 3px solid var(--accent-gold);
  padding: 16px 20px;
  margin-bottom: 24px;
  border-radius: 0 8px 8px 0;
}

.scene-label {
  font-family: var(--font-accent);
  font-size: 12px;
  color: var(--accent-gold);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.scene-text {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.8;
}

.question-text {
  font-family: var(--font-title);
  font-size: clamp(22px, 5vw, 30px);
  color: var(--text-primary);
  margin-bottom: 28px;
  line-height: 1.4;
}

.options-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: rgba(245,240,232,0.8);
  border: 1px solid var(--ink-light);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  text-align: left;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-primary);
  line-height: 1.6;
}

.option-btn:hover {
  border-color: var(--accent-red);
  background: rgba(194,58,42,0.05);
  transform: translateX(8px);
  box-shadow: 0 2px 12px rgba(60,36,21,0.08);
}

.option-btn:active {
  transform: translateX(4px);
}

.option-label {
  font-family: var(--font-title);
  font-size: 22px;
  color: var(--accent-red);
  min-width: 32px;
  text-align: center;
}

/* 结果页 */
.result-screen {
  animation: fadeIn 0.8s ease;
  padding-top: 10px;
}

.result-header {
  text-align: center;
  margin-bottom: 32px;
}

.seal-badge {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 140px;
  height: 140px;
  border: 4px solid;
  border-radius: 12px;
  margin: 0 auto 16px;
  animation: sealStamp 0.6s ease forwards;
  position: relative;
  background: rgba(245,240,232,0.9);
}

.seal-badge::before {
  content: '';
  position: absolute;
  inset: 3px;
  border: 1px solid;
  border-radius: 8px;
  opacity: 0.5;
}

.seal-role-name {
  font-family: var(--font-title);
  font-size: 28px;
  letter-spacing: 4px;
}

.seal-clan {
  font-family: var(--font-accent);
  font-size: 12px;
  margin-top: 4px;
  letter-spacing: 2px;
  opacity: 0.8;
}

.result-alias {
  font-family: var(--font-title);
  font-size: clamp(36px, 8vw, 56px);
  margin: 16px 0 4px;
  line-height: 1.2;
}

.result-modern {
  font-family: var(--font-accent);
  font-size: 16px;
  color: var(--text-secondary);
  letter-spacing: 3px;
}

.quote-box {
  background: rgba(60,36,21,0.04);
  border-left: 3px solid;
  padding: 20px 24px;
  margin: 28px 0;
  border-radius: 0 8px 8px 0;
  min-height: 60px;
}

.quote-text {
  font-family: var(--font-accent);
  font-size: 18px;
  line-height: 1.8;
  font-style: italic;
}

.quote-cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  margin-left: 2px;
  animation: blink 0.8s infinite;
  vertical-align: text-bottom;
}

.section-title {
  font-family: var(--font-title);
  font-size: 22px;
  margin: 28px 0 16px;
  color: var(--text-primary);
  position: relative;
  display: inline-block;
}

.section-title::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 40px;
  height: 2px;
  background: var(--accent-red);
}

.result-desc {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 2;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 24px;
}

.tag {
  font-family: var(--font-accent);
  font-size: 13px;
  padding: 4px 14px;
  border-radius: 20px;
  color: white;
}

.martial-box {
  background: rgba(60,36,21,0.04);
  padding: 20px;
  border-radius: 8px;
  margin: 16px 0;
}

.martial-name {
  font-family: var(--font-title);
  font-size: 22px;
  margin-bottom: 8px;
}

.martial-desc {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-secondary);
}

.personality-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.personality-item {
  font-family: var(--font-accent);
  font-size: 13px;
  padding: 6px 16px;
  background: var(--ink-light);
  border-radius: 4px;
  border: 1px solid var(--ink-light);
}

.radar-container {
  display: flex;
  justify-content: center;
  margin: 20px 0;
}

.radar-container svg {
  max-width: 100%;
  height: auto;
}

.rank-list {
  margin: 20px 0;
}

.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--ink-light);
  animation: slideInRight 0.5s ease forwards;
  opacity: 0;
}

.rank-item:nth-child(1) { animation-delay: 0.1s; }
.rank-item:nth-child(2) { animation-delay: 0.2s; }
.rank-item:nth-child(3) { animation-delay: 0.3s; }
.rank-item:nth-child(4) { animation-delay: 0.4s; }
.rank-item:nth-child(5) { animation-delay: 0.5s; }

.rank-num {
  font-family: var(--font-title);
  font-size: 20px;
  width: 28px;
  text-align: center;
}

.rank-name {
  font-family: var(--font-accent);
  font-size: 14px;
  flex: 1;
}

.rank-bar-bg {
  width: 120px;
  height: 6px;
  background: var(--ink-light);
  border-radius: 3px;
  overflow: hidden;
}

.rank-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1s ease;
}

.rank-score {
  font-family: var(--font-accent);
  font-size: 13px;
  width: 40px;
  text-align: right;
}

.btn-restart {
  display: block;
  margin: 32px auto;
  font-family: var(--font-accent);
  font-size: 16px;
  color: var(--text-secondary);
  background: none;
  border: 1px solid var(--ink-medium);
  padding: 10px 40px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 3px;
  transition: all 0.3s;
}

.btn-restart:hover {
  border-color: var(--accent-red);
  color: var(--accent-red);
}

/* 响应式 */
@media (max-width: 640px) {
  .app { padding: 12px; }
  .seal-badge { width: 110px; height: 110px; }
  .seal-role-name { font-size: 22px; }
  .rank-bar-bg { width: 80px; }
  .option-btn { padding: 12px 14px; font-size: 14px; }
}
</style>
</head>

const LABELS = ['甲','乙','丙','丁'];

let currentScreen = 'start';
let currentQ = 0;
let answers = {};
let results = [];

function render() {
  const app = document.getElementById('app');
  if (currentScreen === 'start') {
    app.innerHTML = renderStart();
  } else if (currentScreen === 'quiz') {
    app.innerHTML = renderQuiz();
  } else if (currentScreen === 'result') {
    app.innerHTML = renderResult();
  }
}

function renderStart() {
  const clanNames = ROLES.map(r => `<span class="clan-tag">${r.clan}</span>`).join('');
  return `
    <div class="start-screen">
      <div class="title-wrapper">
        <h1 class="main-title">武林角色测试</h1>
      </div>
      <p class="sub-title">TechEdict Character Assessment</p>
      <div class="divider-brush"></div>
      <p class="start-desc">
        江湖之大，门派林立。每个技术人心中，都住着一个武侠灵魂。<br>
        二十道江湖情境，测出你在科技门派中的真实身份。
      </p>
      <div class="clans-preview">${clanNames}</div>
      <button class="btn-start" onclick="startQuiz()">开始测试</button>
    </div>
  `;
}

function startQuiz() {
  currentScreen = 'quiz';
  currentQ = 0;
  answers = {};
  render();
}

function renderQuiz() {
  const q = QUESTIONS[currentQ];
  const progress = ((currentQ) / QUESTIONS.length * 100);
  const optionsHtml = q.options.map((opt, i) => `
    <button class="option-btn" onclick="selectOption(${i})">
      <span class="option-label">${LABELS[i]}</span>
      <span>${opt.text}</span>
    </button>
  `).join('');
  return `
    <div class="quiz-screen">
      <p class="progress-text">第 ${currentQ + 1} 题 / 共 ${QUESTIONS.length} 题</p>
      <div class="progress-scroll">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>
      <div class="scene-box">
        <div class="scene-label">场景</div>
        <div class="scene-text">${q.scene}</div>
      </div>
      <h2 class="question-text">${q.question}</h2>
      <div class="options-grid">${optionsHtml}</div>
    </div>
  `;
}

function selectOption(idx) {
  answers[currentQ] = idx;
  currentQ++;
  if (currentQ >= QUESTIONS.length) {
    calculateResults();
    currentScreen = 'result';
  }
  render();
  if (currentScreen === 'result') {
    setTimeout(startTypewriter, 800);
  }
  window.scrollTo(0, 0);
}

function calculateResults() {
  const scores = {};
  ROLES.forEach(r => { scores[r.id] = 0; });
  QUESTIONS.forEach((q, qi) => {
    const sel = answers[qi];
    if (sel !== undefined && q.options[sel]) {
      const opt = q.options[sel];
      for (const [rid, sc] of Object.entries(opt.scores)) {
        if (scores[rid] !== undefined) scores[rid] += sc;
      }
    }
  });
  results = Object.entries(scores)
    .map(([id, score]) => ({ id, score }))
    .sort((a, b) => b.score - a.score);
  const max = results[0].score || 1;
  results.forEach(r => { r.pct = Math.round(r.score / max * 100); });
}

function getRole(id) { return ROLES.find(r => r.id === id); }

function renderResult() {
  const top = getRole(results[0].id);
  const rankHtml = results.slice(0, 5).map((r, i) => {
    const role = getRole(r.id);
    return `
      <div class="rank-item" style="animation-delay:${i*0.15}s">
        <span class="rank-num" style="color:${i===0?top.color:'var(--text-secondary)'}">${i+1}</span>
        <span class="rank-name">${role.alias} (${role.modernRole})</span>
        <div class="rank-bar-bg">
          <div class="rank-bar-fill" style="width:${r.pct}%;background:${role.color}"></div>
        </div>
        <span class="rank-score">${r.pct}%</span>
      </div>
    `;
  }).join('');

  const tagsHtml = top.tags.map(t => `<span class="tag" style="background:${top.color}">${t}</span>`).join('');
  const persHtml = top.personality.map(p => `<span class="personality-item">${p}</span>`).join('');

  const radarSvg = buildRadar(top);

  return `
    <div class="result-screen">
      <div class="result-header">
        <div class="seal-badge" style="border-color:${top.color}">
          <span class="seal-role-name" style="color:${top.color}">${top.name}</span>
          <span class="seal-clan" style="color:${top.color}">${top.clan}</span>
        </div>
        <h2 class="result-alias" style="color:${top.color}">${top.alias}</h2>
        <p class="result-modern">${top.modernRole}</p>
      </div>
      <div class="quote-box" style="border-color:${top.color}">
        <span class="quote-text" id="quoteTarget"></span><span class="quote-cursor" id="cursor"></span>
      </div>
      <h3 class="section-title">角色简介</h3>
      <p class="result-desc">${top.description}</p>
      <div class="tags-row">${tagsHtml}</div>
      <h3 class="section-title">性格特质</h3>
      <div class="personality-row">${persHtml}</div>
      <h3 class="section-title">武功心法</h3>
      <div class="martial-box">
        <div class="martial-name" style="color:${top.color}">${top.martialArt}</div>
        <p class="martial-desc">${top.martialDesc}</p>
      </div>
      <h3 class="section-title">角色契合度</h3>
      <div class="radar-container">${radarSvg}</div>
      <h3 class="section-title">门派排名</h3>
      <div class="rank-list">${rankHtml}</div>
      <button class="btn-restart" onclick="restart()">重新测试</button>
    </div>
  `;
}

function buildRadar(topRole) {
  const dims = ['战略思维','沟通协调','架构设计','质量把控','执行效率','技术创新'];
  const topIdx = ROLES.indexOf(topRole);
  const topScores = {};
  QUESTIONS.forEach((q, qi) => {
    const sel = answers[qi];
    if (sel !== undefined && q.options[sel]) {
      const opt = q.options[sel];
      for (const [rid, sc] of Object.entries(opt.scores)) {
        if (!topScores[rid]) topScores[rid] = 0;
        topScores[rid] += sc;
      }
    }
  });
  const maxS = Math.max(...Object.values(topScores), 1);
  const vals = dims.map((_, i) => {
    const rid = ['cto','pm','architect','qa','devops','fullstack'][i];
    return Math.round((topScores[rid] || 0) / maxS * 100);
  });

  const cx = 150, cy = 150, r = 110, n = 6;
  function pt(i, scale) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    return {
      x: cx + Math.cos(angle) * r * scale,
      y: cy + Math.sin(angle) * r * scale
    };
  }

  let gridLines = '';
  for (let lv = 1; lv <= 4; lv++) {
    const pts = Array.from({length:n}, (_,i) => pt(i, lv/4));
    gridLines += `<polygon points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="var(--ink-light)" stroke-width="1"/>`;
  }

  const axes = Array.from({length:n}, (_,i) => {
    const p = pt(i, 1);
    return `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="var(--ink-light)" stroke-width="1"/>`;
  }).join('');

  const dataPoints = Array.from({length:n}, (_,i) => pt(i, vals[i]/100));
  const dataPolygon = `<polygon points="${dataPoints.map(p=>p.x+','+p.y).join(' ')}" fill="${topRole.color}22" stroke="${topRole.color}" stroke-width="2"/>`;
  const dataDots = dataPoints.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${topRole.color}"/>`).join('');

  const labels = dims.map((d, i) => {
    const p = pt(i, 1.22);
    return `<text x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="middle" font-family="var(--font-accent)" font-size="11" fill="var(--text-secondary)">${d}</text>`;
  }).join('');

  return `<svg viewBox="0 0 300 300" width="300" height="300">
    ${gridLines}${axes}${dataPolygon}${dataDots}${labels}
  </svg>`;
}

let twInterval = null;
function startTypewriter() {
  const top = getRole(results[0].id);
  const text = `"${top.quote}"`;
  const el = document.getElementById('quoteTarget');
  const cursor = document.getElementById('cursor');
  if (!el) return;
  let idx = 0;
  el.textContent = '';
  if (twInterval) clearInterval(twInterval);
  twInterval = setInterval(() => {
    if (idx < text.length) {
      el.textContent += text[idx];
      idx++;
    } else {
      clearInterval(twInterval);
      if (cursor) setTimeout(() => { cursor.style.display = 'none'; }, 1500);
    }
  }, 50);
}

function restart() {
  if (twInterval) clearInterval(twInterval);
  currentScreen = 'start';
  currentQ = 0;
  answers = {};
  results = [];
  window.scrollTo(0, 0);
  render();
}

render();
</script>
